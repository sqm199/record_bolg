{% extends "base.html" %}
{% block title %}德州扑克 — 羚羊之家{% endblock %}

{% block content %}
<div class="page-header">
  <a href="{{ url_for('game_index') }}" class="btn-ghost" style="font-size:0.82rem"><svg class="icon"><use href="#i-arrow-left"/></svg>游戏库</a>
  <h1><svg class="icon"><use href="#i-cards"/></svg>德州扑克</h1>
  <div style="display:flex;align-items:center;gap:0.75rem">
    <span id="roundMsg" style="font-size:0.85rem;color:var(--text-muted)"></span>
    <button class="btn-accent" id="newRoundBtn" onclick="startNewRound()">开始游戏</button>
  </div>
</div>

<div class="poker-layout">
  <!-- 信息栏 -->
  <div class="poker-info-bar">
    <div class="info-item"><span class="info-label">底池</span><span class="info-value" id="potDisplay">0</span></div>
    <div class="info-item"><span class="info-label">盲注</span><span class="info-value">10/20</span></div>
    <div class="info-item"><span class="info-label">阶段</span><span class="info-value" id="phaseDisplay">等待开始</span></div>
  </div>

  <!-- 桌面容器 -->
  <div class="table-wrapper" id="tableWrapper">
    <div class="poker-table" id="pokerTable">
      <div class="community-cards" id="communityCards"></div>
      <div class="table-label">德州扑克</div>
    </div>
    <!-- 玩家位置: bots 在上/左/右，玩家在正下方 -->
    <div class="player-spot spot-top-left" id="spot-1"></div>
    <div class="player-spot spot-top-right" id="spot-2"></div>
    <div class="player-spot spot-left" id="spot-3"></div>
    <div class="player-spot spot-right" id="spot-4"></div>
    <div class="player-spot spot-bottom" id="spot-0"></div>
  </div>

  <!-- 操作栏 -->
  <div class="action-bar" id="actionBar">
    <div class="action-left">
      <span id="actionStatus" style="font-size:0.85rem;color:var(--text-muted)">点击「开始新局」</span>
    </div>
    <div class="action-right" id="actionButtons" style="display:none">
      <input type="range" id="raiseSlider" min="0" max="100" value="0" class="raise-slider" oninput="updateRaiseLabel()">
      <span id="raiseLabel" class="raise-label">加注: 0</span>
      <button class="btn-danger" onclick="playerAction('fold')">弃牌</button>
      <button class="btn-ghost" id="callBtn" onclick="playerAction('call')">过牌</button>
      <button class="btn-accent" id="raiseBtn" onclick="playerAction('raise')">加注</button>
    </div>
  </div>
</div>
{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/texas.css') }}">
{% endblock %}

{% block scripts %}
<script>
  const PHASES = { idle:'等待开始', preflop:'翻牌前', flop:'翻牌', turn:'转牌', river:'河牌', showdown:'摊牌' };
  const SUIT_COLORS = { '♠':'black','♣':'black','♥':'red','♦':'red' };
  // player[0]=human→spot-0(bottom), player[1..4]=bots→spot-1..4
  const SPOT_IDS = ['spot-0','spot-1','spot-2','spot-3','spot-4'];

  async function apiCall(url, body) {
    const opts = { method: body ? 'POST' : 'GET' };
    if (body) { opts.headers = {'Content-Type':'application/x-www-form-urlencoded'}; opts.body = new URLSearchParams(body); }
    const r = await fetch(url, opts);
    return r.json();
  }

  async function startNewRound() {
    const data = await apiCall('/api/texas/new', {});
    if (data.code === 1) renderState(data.state);
  }

  async function playerAction(action) {
    const body = { action };
    if (action === 'raise') body.amount = parseInt(document.getElementById('raiseSlider').value);
    const data = await apiCall('/api/texas/action', body);
    if (data.code === 1) renderState(data.state);
    else document.getElementById('actionStatus').textContent = data.msgs || '操作失败';
  }

  async function loadState() {
    const data = await apiCall('/api/texas/state');
    if (data.code === 1) renderState(data.state);
  }

  function updateRaiseLabel() {
    document.getElementById('raiseLabel').textContent = '加注: ' + document.getElementById('raiseSlider').value;
  }

  function renderCard(c) {
    const el = document.createElement('div');
    el.className = 'poker-card ' + (SUIT_COLORS[c.suit] || 'black');
    el.innerHTML = '<span class="card-rank">' + (c.name ? c.name.slice(0,-1) : '') + '</span>' +
                   '<span class="card-suit">' + (c.suit || '') + '</span>';
    return el;
  }

  function renderBackCard() {
    const el = document.createElement('div');
    el.className = 'poker-card back';
    return el;
  }

  function renderState(state) {
    document.getElementById('potDisplay').textContent = state.pot;
    document.getElementById('phaseDisplay').textContent = PHASES[state.phase] || state.phase;
    document.getElementById('roundMsg').textContent = state.message || '';

    // Community cards
    const cc = document.getElementById('communityCards');
    cc.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      if (i < state.community_cards.length)
        cc.appendChild(renderCard(state.community_cards[i]));
      else {
        const ph = document.createElement('div'); ph.className = 'card-placeholder'; cc.appendChild(ph);
      }
    }

    // Players
    state.players.forEach((p, i) => {
      const spot = document.getElementById(SPOT_IDS[i]);
      if (!spot) return;

      let cardsHtml = '<div class="pcards">';
      if (p.hole_cards && p.hole_cards.length) {
        p.hole_cards.forEach(c => {
          if (c.rank === 0) cardsHtml += '<div class="poker-card back"></div>';
          else {
            const color = SUIT_COLORS[c.suit] || 'black';
            cardsHtml += '<div class="poker-card ' + color + '">' +
                         '<span class="card-rank">' + (c.name ? c.name.slice(0,-1) : '') + '</span>' +
                         '<span class="card-suit">' + c.suit + '</span></div>';
          }
        });
      }
      cardsHtml += '</div>';

      let badges = '';
      if (i === state.dealer_idx) badges += '<span class="pbadge pbadge-d">D</span>';
      if (p.folded) badges += '<span class="pbadge pbadge-fold">已弃牌</span>';
      if (p.all_in) badges += '<span class="pbadge pbadge-allin">All-in</span>';
      if (!state.round_over && i === state.current_player_idx && !p.folded && !p.all_in)
        badges += '<span class="pbadge pbadge-active">行动中</span>';

      const handDesc = p.hand_desc ? '<div class="phand">' + p.hand_desc + '</div>' : '';
      const bet = p.current_bet > 0 ? '<div class="pbet">下注 ' + p.current_bet + '</div>' : '<div class="pbet"></div>';

      spot.innerHTML =
        '<div class="pname">' + p.name + '</div>' +
        '<div class="pchips">💰 ' + p.chips + '</div>' + bet +
        '<div class="pbadges">' + badges + '</div>' + handDesc + cardsHtml;

      // Highlight current player
      spot.classList.toggle('highlight', !state.round_over && i === state.current_player_idx && !p.folded && !p.all_in);
    });

    // Action bar
    const actionBar = document.getElementById('actionButtons');
    const actionStatus = document.getElementById('actionStatus');
    const newBtn = document.getElementById('newRoundBtn');

    if (state.round_over) {
      actionBar.style.display = 'none';
      const winners = state.winners || [];
      if (winners.length) {
        actionStatus.innerHTML = '<span class="win-text">🏆 ' +
          winners.map(w => w.name + ' 赢得 ' + w.amount + ' 筹码（' + w.hand_desc + '）').join('，') + '</span>';
      }
      newBtn.style.display = '';
    } else {
      const human = state.players.find(p => p.is_human);
      const current = state.players[state.current_player_idx];
      if (human && current && current.is_human && !human.folded && !human.all_in) {
        actionBar.style.display = '';
        const callAmt = state.current_bet - (human.current_bet || 0);
        const callBtn = document.getElementById('callBtn');
        if (callAmt === 0) {
          callBtn.textContent = '过牌'; callBtn.className = 'btn-ghost';
        } else {
          callBtn.textContent = '跟注 ' + callAmt; callBtn.className = 'btn-accent';
        }
        const maxRaise = human.chips + (human.current_bet || 0);
        const minRaise = state.current_bet + 20;
        const slider = document.getElementById('raiseSlider');
        slider.min = minRaise; slider.max = maxRaise;
        slider.value = Math.max(minRaise, Math.min(minRaise * 2, maxRaise));
        updateRaiseLabel();
        actionStatus.textContent = '轮到你了 — 请操作';
      } else {
        actionBar.style.display = 'none';
        actionStatus.textContent = state.message || '等待中…';
      }
      newBtn.style.display = 'none';
    }
  }

  // Init — 页面加载时不自动开始，等待点击「开始游戏」
  document.getElementById('newRoundBtn').style.display = '';
  document.getElementById('actionButtons').style.display = 'none';
  document.getElementById('actionStatus').textContent = '点击「开始游戏」开始对局';
</script>
{% endblock %}
