{% from "_note_tree_macros.html" import note_tree %}
<aside class="notes-rail" id="notesRail" aria-label="笔记目录">
  <div class="notes-rail-head">
    <a class="notes-rail-title" href="{{ url_for('note') }}">
      <svg class="icon"><use href="#i-book"/></svg>
      <span>笔记库</span>
      <span class="notes-count">{{ stats.total }}</span>
    </a>
    <a href="{{ url_for('note_new') }}" class="icon-btn notes-new-btn" title="新建笔记" aria-label="新建笔记">
      <svg class="icon"><use href="#i-plus"/></svg>
    </a>
  </div>

  <form class="notes-search" action="{{ url_for('note_search') }}" method="get" role="search">
    <label class="sr-only" for="noteTreeSearch">筛选笔记目录</label>
    <svg class="icon notes-search-icon" aria-hidden="true"><use href="#i-search"/></svg>
    <input id="noteTreeSearch" name="q" type="search" value="{{ q }}"
           placeholder="搜索标题，回车搜全文" autocomplete="off" spellcheck="false">
    <kbd aria-hidden="true">/</kbd>
  </form>

  <div class="note-tree-scroll">
    {% if tree %}
      {{ note_tree(tree, current_id) }}
      <p class="note-tree-empty" id="noteTreeNoMatch" hidden>没有匹配的笔记</p>
    {% else %}
      <div class="notes-rail-empty">
        <p>还没有笔记</p>
        <a href="{{ url_for('note_new') }}">写第一篇</a>
      </div>
    {% endif %}
  </div>

  <div class="notes-rail-foot">
    <a href="{{ url_for('note') }}" class="notes-rail-all">
      <svg class="icon"><use href="#i-list"/></svg>全部笔记
    </a>
    <span class="notes-rail-hint">最多 {{ NOTE_MAX_CHILD_DEPTH + 1 }} 层</span>
  </div>
</aside>
<div class="notes-rail-backdrop" id="notesRailBackdrop" hidden></div>
