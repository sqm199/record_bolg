{% extends "base.html" %}
{% block title %}Game — 羚羊之家{% endblock %}

{% block content %}
<div class="page-header">
  <h1><svg class="icon"><use href="#i-game"/></svg>游戏</h1>
</div>

<div class="game-grid">
  <a href="{{ url_for('game_texas') }}" class="game-card">
    <div class="game-cover"><svg class="icon"><use href="#i-cards"/></svg></div>
    <div class="game-info">
      <h3>德州扑克</h3>
      <p>Texas Hold'em · 单机模式</p>
      <span class="game-tag">1 真人 + 4 机器人</span>
    </div>
  </a>

  <div class="game-card game-card-locked">
    <div class="game-cover"><svg class="icon"><use href="#i-lock"/></svg></div>
    <div class="game-info">
      <h3>敬请期待</h3>
      <p>更多游戏即将上线</p>
    </div>
  </div>
</div>
{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/game.css') }}">
{% endblock %}
