# record_bolg 反向代理配置
# Flask 应用监听 127.0.0.1:1111（main.py 中 app.run(host='0.0.0.0', port=1111)）
# 静态资源（static/photo/note）由 nginx 直接吐出，绕过 Python
#
# 使用方式：
#   1. 修改下方 server_name 为你的实际域名
#   2. 修改 root 路径为项目部署目录的绝对路径（示例为 Linux 路径，按需替换）
#   3. include 进 nginx.conf 的 http 块，或放到 conf.d/sites-enabled 下
#   4. nginx -t && nginx -s reload

upstream record_bolg_app {
    server 127.0.0.1:1111;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;

    # 如启用 HTTPS，把下面这块打开并注释掉上面的 listen 80
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/your-domain.crt;
    # ssl_certificate_key /etc/nginx/ssl/your-domain.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    # 同时也建议加一个 80 -> 443 的跳转 server 块

    charset utf-8;

    # 上传图片接口需要放开 body 大小（按需调整）
    client_max_body_size 20m;
    client_body_buffer_size 256k;

    # 项目部署根目录（Linux 示例；Windows 部署用 IIS，无需此 nginx 配置）
    root /var/www/record_bolg;

    access_log /var/log/nginx/record_bolg.access.log;
    error_log  /var/log/nginx/record_bolg.error.log warn;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript
               image/svg+xml font/ttf font/otf application/font-woff
               application/font-woff2;

    # ---------- 静态资源直出 ----------

    # 项目自带的前端资源（jQuery / Bootstrap / Layer.js）
    location /static/ {
        alias /var/www/record_bolg/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 用户上传的图片（main.py: UPLOAD_FOLDER = ./photo）
    # Flask 里通过 /photo/<filename> 路由读取，这里让 nginx 直接吐出
    location /photo/ {
        alias /var/www/record_bolg/photo/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 静态 HTML 日志：路由 /notes/<filename> 对应 note/ 目录下的 HTML
    # 默认走 Flask（带登录校验）；若希望对外免登录直读，可启用下面这段
    # location /notes/ {
    #     alias /var/www/record_bolg/note/;
    #     try_files $uri $uri/ =404;
    # }

    # favicon / robots：避免无谓的 Python 调用
    location = /favicon.ico {
        alias /var/www/record_bolg/static/favicon.ico;
        access_log off;
        log_not_found off;
    }
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # ---------- 反向代理到 Flask ----------

    location / {
        proxy_pass http://record_bolg_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffers 8 32k;
        proxy_buffer_size 32k;
    }

    # 隐藏敏感路径
    location ~ /\.(git|env|venv|idea|vscode) {
        deny all;
        return 404;
    }
    location ~* \.(py|pyc|toml|lock|md|log)$ {
        deny all;
        return 404;
    }
}